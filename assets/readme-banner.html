<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Axel's Project Directory</title>
<style>
@page { size: 1120px 300px; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; color: #f7f5ff; font-family: "DejaVu Sans", sans-serif; }
.banner {
  position: relative; width: 1120px; height: 300px; overflow: hidden;
  padding: 60px 65px;
  background: linear-gradient(112deg, #181b30 8%, #29204c 62%, #352565 100%);
}
.art { position: absolute; left: 785px; top: -97px; width: 370px; height: 460px; }
.ring { position: absolute; border: 2px solid #9275eb; border-radius: 200px; width: 340px; height: 340px; }
.ring.second { top: 64px; left: 62px; border-color: #66d9c5; }
.ring.third { top: 128px; left: 126px; border-color: #c3aeff; }
.label { margin: 0; color: #8ef0db; font: bold 19px "DejaVu Sans Mono", monospace; letter-spacing: 4px; }
h1 { margin: 16px 0 12px; font-size: 65px; letter-spacing: -3px; }
.description { margin: 0; font-size: 25px; color: #ded7fa; }
</style>
<main class="banner">
  <div class="art" aria-hidden="true"><div class="ring"></div><div class="ring second"></div><div class="ring third"></div></div>
  <p class="label">AXEL / ZEOTYX</p>
  <h1>Project Directory</h1>
  <p class="description">Apps, games, and programming experiments</p>
</main>
</html>
